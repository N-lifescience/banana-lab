<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>간이 원심분리기로 혈액 원심분리하기</title>
<!-- 보고서 "종이" 모양. 인쇄할 때만 필요하다 (teacher.html 도 같은 파일을 쓴다). -->
<link rel="stylesheet" href="/report-sheet.css" media="print">
<!-- 교사가 링크를 채팅방에 붙일 때 무엇인지 보이도록. 이미지는 두지 않는다 —
     이 앱의 화면은 학생이 조작해서 만드는 것이라 대표 그림이 따로 없다. -->
<meta name="description" content="고등학교 탐구활동을 웹에서 직접 해 보는 탐구형 가상실험. 손끝에서 혈액을 받아 모세관에 담고, 끈을 리듬 있게 당겨 돌려 갈라진 층을 관찰합니다. 개인정보를 수집하지 않습니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="간이 원심분리기로 혈액 원심분리하기">
<meta property="og:description" content="손끝에서 받은 혈액을 모세관에 담아 끈을 당겨 돌리고, 갈라진 층을 자로 재는 탐구형 가상실험.">
<!-- 배포 주소가 정해져 넣었다 (T00 에서 아예 빼 두었던 것). **틀린 주소는 없는 주소보다
     나쁘다** — 검색엔진에 「이 페이지는 저 사이트의 사본」이라고 말하는 태그다.
     `vercel.json` 의 `cleanUrls` 때문에 `/teacher` `/privacy` 가 200 이고 `.html` 은 308 이라,
     **확장자 없는 쪽**을 적는다. 배포본을 두드려 확인했다. -->
<link rel="canonical" href="https://virtual-biolab.vercel.app/cell-metabolism/centrifuge">
<meta property="og:url" content="https://virtual-biolab.vercel.app/cell-metabolism/centrifuge">
<!-- 화면 CSS 는 여덟 실험이 함께 쓰는 한 파일이다 (docs/09-uniformity.md §1).
     아래 <style> 에는 **이 실험에만 있는 위젯** — 손끝 무대·끈에 달린 링·박자·누르는 깊이 —
     만 둔다. 공용 선택자를 다시 적으면 tests/uniformity.test.js 가 잡는다. -->
<link rel="stylesheet" href="/packages/lab-kit/style/shell.css">
<style>
  /* 안전 유의 사항 밑의 「이 앱은 확인하지 않습니다」 — 혈액과 날붙이를 다루는 이 실험에만 있다. */
  .safety-disclaimer{border:1px solid var(--warn);border-radius:6px;padding:9px 11px;
    font-size:12.5px;line-height:1.65;color:var(--ink);background:var(--sunk);margin:0 0 14px}

  /* ── 확대 뷰의 손도구 무대 ──
     손가락으로 **끌** 것은 손도구(모세관·링)뿐이다.
     무대 전체에 touch-action:none 을 걸면 그 위에 손을 대고 밀어도 아무 일이 없어서,
     가로 모드에서 패널이 넘칠 때 아래쪽 단추에 손이 닿지 않는다. pan-y 로 세로 스크롤만 돌려준다. */
  .zoom-stage{background:var(--sunk);border-radius:6px;padding:14px 10px;position:relative;
    display:flex;align-items:center;justify-content:center;gap:10px;min-height:150px;touch-action:pan-y}
  .zoom-stage--seal{flex-direction:column;gap:0}
  .zoom-stage--spin{flex-direction:column;gap:8px}
  .zoom-figure{line-height:0}
  .zoom-figure svg{width:100%;height:auto;display:block}
  .zoom-figure--finger{flex:0 0 140px}
  .zoom-figure--clay{flex:0 0 150px;width:150px}
  .zoom-figure--rotor{flex:0 0 auto;width:min(100%,300px)}

  /* 손에 쥔 물건. 끌어서 각도·깊이를 정한다. */
  .zoom-tool{flex:0 0 190px;width:190px;padding:0;background:none;border:none;
    cursor:grab;touch-action:none;line-height:0;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .zoom-tool:active{cursor:grabbing}
  .zoom-tool svg{width:100%;height:auto;display:block;pointer-events:none;overflow:visible}
  .zoom-tool--tube{width:min(100%,320px);flex:0 0 auto;
    transform:translateY(calc(var(--press,0) * 34px))}

  /* 끈에 달린 링. 아래로 끌수록 세게 당긴다. */
  .zoom-ring{width:88px;height:88px;border-radius:50%;border:6px solid var(--ink-mute);
    background:var(--surface);color:var(--ink);cursor:grab;touch-action:none;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
    transform:translateY(calc(var(--pull,0) * 26px))}
  .zoom-ring:active,.zoom-ring.is-pulling{cursor:grabbing;border-color:var(--indigo)}
  .zoom-ring-cap{pointer-events:none}

  /* 박자 표시 — 「지금 당길 때」가 눈에 보여야 리듬이 손에 잡힌다. */
  .zoom-beat{margin:12px 0 6px}
  .zoom-beat .bar{height:12px;border-radius:99px;background:var(--rule);overflow:hidden}
  .zoom-beat .fill{height:100%;width:0;background:var(--ink-mute);border-radius:99px}
  .zoom-beat.is-now .fill{background:var(--good)}
  .zoom-beat-label{display:block;font-size:13px;font-weight:600;color:var(--ink-mute);margin-bottom:4px}
  .zoom-beat.is-now .zoom-beat-label{color:var(--good)}
  .zoom-beat--small{opacity:.65}
  .zoom-beat--small .bar{height:6px}
  .zoom-beat--small .zoom-beat-label{font-size:11.5px}

  /* 누르는 깊이 — 얕으면 새고 너무 세면 부러진다. 두 자리를 눈금에 표시해 둔다. */
  .zoom-press{margin:10px 0}
  .zoom-press .bar{position:relative;height:10px;border-radius:99px;background:var(--sunk);
    border:1px solid var(--rule);overflow:hidden}
  .zoom-press .zone{position:absolute;top:0;bottom:0;opacity:.28}
  .zoom-press .zone--weak{left:0;background:var(--warn)}
  .zoom-press .zone--break{right:0;background:var(--danger,#A82920)}
  .zoom-press .fill{position:absolute;left:0;top:0;bottom:0;background:var(--indigo);opacity:.75}
  .zoom-press .cap{display:flex;justify-content:space-between;font-size:11.5px;
    color:var(--ink-mute);margin-top:4px;gap:10px}

  /* 밀어 넣은 깊이 — 두 쪽이 다르면 흔들린다 */
  .zoom-seats{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .zoom-seat{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-mute)}
  .zoom-seat span{min-width:120px}
  .zoom-seat input[type=range]{flex:1;accent-color:var(--indigo)}

  /* 지금 모세관이 어떻게 갈려 있는지 — 당기는 동안 실시간으로 바뀐다 */
  .zoom-result{background:var(--sunk);border-radius:6px;padding:8px;margin:12px 0}
  .zoom-result svg{width:100%;height:auto;display:block}

  /* 방향은 **글자로** 적는다. 없으면 위/아래로 되돌려 생각하다 뒤집는다. */
  .zoom-compass{font-size:12px;color:var(--ink-mute);margin:4px 0 10px}
  /* 조용한 단추 — 손으로 감싸 멈추기 · 고무찰흙 떼어 내기 */
  .zoom-secondary{width:100%;padding:8px 14px;font-size:13px;margin:6px 0}
</style>
</head>
<body>
<div id="start" class="start-screen"></div>
<div id="app" hidden>
  <div class="layout">
    <div id="bench" aria-label="실험대"></div>
    <div id="notebook"></div>
  </div>
  <div id="toast-region"></div>
  <div id="zoom" hidden></div>
  <div id="report"></div>
</div>
<!-- 개인정보처리방침 링크는 **정적 HTML 에** 둔다.
     시작 화면은 자바스크립트가 그리므로, 응답 HTML 만 읽는 쪽(검사 도구·크롤러)에는
     아무것도 안 보인다. 사람에게도 늘 보여야 하는 링크라 화면 구석에 띄워 둔다. -->
<footer class="site-foot">
  <a href="/privacy">개인정보처리방침</a>
</footer>
<script type="module" src="/experiments/centrifuge/src/main.js"></script>
</body>
</html>
