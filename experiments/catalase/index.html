<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>효소의 작용에 영향을 미치는 요인 탐구하기</title>
<!-- 보고서 "종이" 모양. 인쇄할 때만 필요하다 (teacher.html 도 같은 파일을 쓴다). -->
<link rel="stylesheet" href="/report-sheet.css" media="print">
<!-- 교사가 링크를 채팅방에 붙일 때 무엇인지 보이도록. 이미지는 두지 않는다 —
     이 앱의 화면은 학생이 조작해서 만드는 것이라 대표 그림이 따로 없다. -->
<meta name="description" content="고등학교 생명과학 탐구 실험을 웹에서 직접 해 보는 탐구형 가상실험. 조작변인과 통제변인을 스스로 정하고, 감자즙 원반이 과산화수소수에서 떠오르는 시간을 잽니다. 개인정보를 수집하지 않습니다.">

<!-- ★ **이 실험이 사는 자리**를 가리킨다 — 사이트 뿌리가 아니다.
     따로 서 있던 시절에는 이 실험이 자기 저장소의 뿌리였다. 합친 뒤로 여기를 비워 두면
     검색과 링크 미리보기가 무엇을 이 실험으로 여길지 알 수 없다.
     교과 주소를 쓴다 — 폴더 주소(`/experiments/…`)는 안쪽 사정이다.
     (합치기 5단계, 2026-08-30) -->
<link rel="canonical" href="https://virtual-biolab.vercel.app/cell-metabolism/catalase">
<meta property="og:type" content="website">
<meta property="og:title" content="효소의 작용에 영향을 미치는 요인 탐구하기">
<meta property="og:description" content="조작변인과 통제변인을 스스로 정해, 효소의 작용에 무엇이 영향을 주는지 찾는 탐구형 가상실험.">
<meta property="og:url" content="https://virtual-biolab.vercel.app/cell-metabolism/catalase">

<!-- 화면 CSS 는 여덟 실험이 함께 쓰는 한 파일이다 (docs/09-uniformity.md §1).
     아래 스타일 블록에는 **이 실험에만 있는 위젯**(변인 설계 판·설계 문장)만 둔다 —
     공용 선택자를 다시 적으면 tests/uniformity.test.js 가 잡는다. -->
<link rel="stylesheet" href="/packages/lab-kit/style/shell.css">
<style>
  /* ── 설계 문장 — 「무엇을 바꾸고 무엇을 같게 하기로 했나」 한 줄 ─────────── */
  .shell-sentence{font-size:13.5px;max-width:62ch;color:var(--ink);background:var(--sunk);
    border-radius:6px;padding:12px 14px;border-left:3px solid var(--indigo)}

  /* ── 변인 설계 판 (src/ui/design.js) ──────────────────────────────
     이 화면은 다른 설계 실험(fermentation)이 그대로 재활용한다. 그래서 클래스 이름에
     이 실험의 말이 없다. */
  .design-card{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:20px}
  .design-card h2{font-size:19px;margin:0 0 4px}
  .design-lead{font-size:13.5px;color:var(--ink-mute);margin:0 0 18px}
  .design-section{border-top:1px solid var(--rule);padding-top:14px;margin-top:14px}
  .design-section:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .design-section h3{font-size:13px;letter-spacing:.05em;margin:0 0 2px}
  .design-hint{font-size:12.5px;color:var(--ink-mute);margin:0 0 10px}
  .design-picks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:560px){.design-picks{grid-template-columns:1fr}}
  /* 잡는 영역 최소 44 px. 그림이 작아도 손에 잡히는 대로 동작해야 한다 */
  .design-pick{display:flex;flex-direction:column;gap:3px;text-align:left;padding:11px 13px;
    min-height:44px;background:var(--sunk);border:1px solid var(--rule);border-radius:6px}
  /* 고른 것의 글자색은 **--ground** 다. `#fff` 로 박으면 다크 모드에서 --indigo 가
     밝은 색이 되어 밝은 바탕에 흰 글씨가 된다 — 고른 칸이 가장 안 읽히게 된다.
     --ground 는 라이트에서 거의 흰색, 다크에서 거의 검정이라 두 테마 모두에서 뒤집힌다. */
  .design-pick[aria-checked="true"]{background:var(--indigo);color:var(--ground);border-color:var(--indigo)}
  .design-pick-name{font-weight:600;font-size:14px}
  .design-pick-desc{font-size:12px;opacity:.8}
  .design-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:7px}
  .design-row-name{font-size:12.5px;color:var(--ink-mute);min-width:11em}
  .design-chips{display:flex;gap:5px;flex-wrap:wrap}
  .design-chip{min-height:36px;padding:6px 12px;font-size:13px;border-radius:99px;
    background:var(--sunk);border:1px solid var(--rule)}
  .design-chip[aria-checked="true"]{background:var(--indigo);color:var(--ground);border-color:var(--indigo)}
  .design-dependent{font-size:14px;font-weight:600;margin:0}
  .design-go{width:100%;margin-top:18px;padding:12px;font-size:14px;font-weight:600;
    background:var(--good);color:var(--ground);border-color:var(--good)}
  .design-note{font-size:12.5px;color:var(--ink-mute);margin:8px 0 0}
</style>
</head>
<body>
<div id="start" class="start-screen"></div>
<!-- 실험 화면. 시작 화면에서 단계를 고르면 main.js 가 hidden 을 벗긴다.
     실험대(#bench)와 탐구 노트(#notebook)는 T05·T07 에서 이 안에 들어온다. -->
<div id="app" hidden>
  <div class="layout">
    <div id="bench" aria-label="실험대"></div>
    <div id="side">
      <!-- 탐구 노트. 실험대 옆에 둔다 — 무엇을 왜 하는지와 실제 조작이 한 화면에 있어야 한다. -->
      <div id="notebook"></div>
      <div id="design-root"></div>
      <p class="shell-sentence" id="design-sentence"></p>
      <!-- 결과 그래프. 설계 바로 아래에 둔다 — 「무엇을 바꾸기로 했나」와
           「그래서 어떻게 나왔나」가 한 화면에서 이어져야 한다. -->
      <section class="result-card">
        <h2 id="graph-title"></h2>
        <div id="graph"></div>
        <ul class="graph-notes" id="graph-notes"></ul>
      </section>
    </div>
  </div>
  <div id="toast-region"></div>
  <!-- 확대 뷰 — 물건을 누르면 열린다. 틀은 packages/lab-kit/ui/zoom-shell.js 가 만든다. -->
  <div id="zoom" hidden></div>
  <div id="report"></div>
</div>
<!-- 개인정보처리방침 링크는 **정적 HTML 에** 둔다.
     시작 화면은 자바스크립트가 그리므로, 응답 HTML 만 읽는 쪽(검사 도구·크롤러)에는
     아무것도 안 보인다. 사람에게도 늘 보여야 하는 링크라 화면 구석에 띄워 둔다. -->
<footer class="site-foot">
  <a href="/privacy">개인정보처리방침</a>
</footer>
<script type="module" src="/experiments/catalase/src/main.js"></script>
</body>
</html>
