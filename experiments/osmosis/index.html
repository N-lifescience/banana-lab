<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 탭에 뜨는 이름. 앱 안 제목(UI.appTitle)과 **같아야 한다** —
     복제해서 만든 저장소라 여기가 실제로 바나나인 채로 남아 있었다.
     tests/pages.test.js 가 두 곳이 어긋나면 잡는다. -->
<title>세포에서 일어나는 삼투 현상 관찰하기</title>
<!-- 보고서 "종이" 모양. 인쇄할 때만 필요하다 (teacher.html 도 같은 파일을 쓴다). -->
<link rel="stylesheet" href="/report-sheet.css" media="print">
<!-- 교사가 링크를 채팅방에 붙일 때 무엇인지 보이도록. 이미지는 두지 않는다 —
     이 앱의 화면은 학생이 조작해서 만드는 것이라 대표 그림이 따로 없다. -->
<meta name="description" content="과학 관찰 실험을 웹에서 직접 해 보는 탐구형 가상실험. 적양파 표피 슬라이드를 만들고 덮개 유리 아래 용액을 바꿔 가며 세포를 관찰합니다. 개인정보를 수집하지 않습니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="세포에서 일어나는 삼투 현상 관찰하기">
<meta property="og:description" content="적양파 표피 슬라이드를 만들고, 덮개 유리 아래 용액을 거름종이로 바꿔 가며 같은 세포를 현미경으로 지켜보는 탐구형 가상실험.">
<!-- ★ **이 실험이 사는 자리**를 가리킨다 — 사이트 뿌리가 아니다.
     따로 서 있던 시절에는 이 실험이 자기 저장소의 뿌리였고, 주소도 그때 것이
     (`osmosis-virtual-lab.vercel.app/`) 그대로 남아 있었다. 합친 뒤로 그 주소는
     **다른 배포본**을 가리킨다 — 검색엔진에는 「이쪽 말고 저쪽을 색인하라」고 말하는
     셈이고, 채팅방에 붙인 링크의 미리보기도 옛 사이트로 뜬다.
     **틀린 주소는 없는 주소보다 나쁘다.**
     교과 주소를 쓴다 — 폴더 주소(`/experiments/…`)는 안쪽 사정이다.
     (합치기 4단계, 2026-08-30) -->
<link rel="canonical" href="https://virtual-biolab.vercel.app/cell-metabolism/osmosis">
<meta property="og:url" content="https://virtual-biolab.vercel.app/cell-metabolism/osmosis">
<!-- 화면 CSS 는 여덟 실험이 함께 쓰는 한 파일이다 (docs/09-uniformity.md §1).
     실험에만 있는 위젯이 생기면 아래에 style 블록을 두고 그것만 적는다 — 공용 선택자를 다시 적으면
     tests/uniformity.test.js 가 잡는다. 지금 이 실험은 공용 것으로 다 그려진다. -->
<link rel="stylesheet" href="/packages/lab-kit/style/shell.css">
</head>
<body>
<div id="start" class="start-screen"></div>
<div id="app" hidden>
  <div class="layout">
    <div id="bench" aria-label="실험대"></div>
    <!-- 토스트는 **실험대와 노트 사이**에 둔다. 넓은 화면에서는 position:fixed 라 흐름에서
         빠지므로 격자 칸을 만들지 않고, 좁아지면 그 자리에서 자리를 차지한다 (공용 CSS 참고). -->
    <div id="toast-region"></div>
    <div id="notebook"></div>
  </div>
  <div id="zoom" hidden></div>
  <div id="report"></div>
</div>
<!-- 개인정보처리방침 링크는 **정적 HTML 에** 둔다.
     시작 화면은 자바스크립트가 그리므로, 응답 HTML 만 읽는 쪽(검사 도구·크롤러)에는
     아무것도 안 보인다. 사람에게도 늘 보여야 하는 링크라 화면 구석에 띄워 둔다. -->
<footer class="site-foot">
  <a href="/privacy">개인정보처리방침</a>
</footer>
<script type="module" src="/experiments/osmosis/src/main.js"></script>
</body>
</html>
