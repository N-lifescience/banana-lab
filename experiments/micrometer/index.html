<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현미경으로 세포의 크기 측정하기</title>
<!-- 보고서 "종이" 모양. 인쇄할 때만 필요하다 (teacher.html 도 같은 파일을 쓴다). -->
<link rel="stylesheet" href="/report-sheet.css" media="print">
<!-- 교사가 링크를 채팅방에 붙일 때 무엇인지 보이도록. 이미지는 두지 않는다 —
     이 앱의 화면은 학생이 조작해서 만드는 것이라 대표 그림이 따로 없다. -->
<meta name="description" content="접안·대물 마이크로미터로 공변세포의 크기를 재는 탐구형 가상실험. 배율을 바꾸면 칸 수는 달라져도 µm 는 같다는 것을 학생이 자기 숫자로 만난다.">
<!-- ★ **이 실험이 사는 자리**를 가리킨다 — 사이트 뿌리가 아니다.
     앞서 여기는 비어 있었다. 「배포 주소가 정해지면 넣는다」고 적어 두었는데,
     정해진 뒤에도 아무도 안 왔다 — **비워 둔 자리는 아무 검사도 울지 않는다.**
     교과 주소를 쓴다 — 폴더 주소(`/experiments/…`)는 안쪽 사정이다.
     (합치기 4단계, 2026-08-30) -->
<link rel="canonical" href="https://virtual-biolab.vercel.app/cell-metabolism/micrometer">
<meta property="og:type" content="website">
<meta property="og:title" content="현미경으로 세포의 크기 측정하기">
<meta property="og:description" content="접안·대물 마이크로미터로 공변세포의 크기를 재는 탐구형 가상실험. 배율을 바꾸면 칸 수는 달라져도 µm 는 같다는 것을 학생이 자기 숫자로 만난다.">
<meta property="og:url" content="https://virtual-biolab.vercel.app/cell-metabolism/micrometer">
<!-- 화면 CSS 는 여덟 실험이 함께 쓰는 한 파일이다 (docs/09-uniformity.md §1).
     실험에만 있는 위젯이 생기면 아래 <style> 에 그것만 적는다 — 공용 선택자를 다시 적으면
     tests/uniformity.test.js 가 잡는다. -->
<link rel="stylesheet" href="/packages/lab-kit/style/shell.css">
<style>
  /* ── 이 실험에만 있는 위젯 ──────────────────────────────────────────
     공용 껍데기(shell.css)에 없는 것만 둔다. 같은 뜻의 규칙이 공용에 생기면 여기서 뺀다. */

  /* 찍는 법. 「무엇을 찍을까요?」 만 묻고 어떻게 찍는지는 안 알려 주고 있었다.
     현미경 화면의 나사 안내 줄도 같은 모양이다. */
  .pick-how{font-size:12.5px;color:var(--ink-mute);margin:6px 0 0;line-height:1.6}
  .pick-how b{color:var(--ink)}

  /* 5쪽 — 아직 안 기록한 시야. 조건을 낮추는 대신 조건을 보이게 한다. */
  .results-todo{background:var(--sunk);border-radius:8px;padding:12px 14px;margin:0 0 14px;
    font-size:13px;line-height:1.6}
  .results-todo ul{margin:6px 0 0;padding-left:20px}
  .results-todo li{margin:2px 0}
  .results-todo-hint{margin:8px 0 0;font-size:12.5px;color:var(--ink-mute)}
  .results-todo--done{color:var(--good);font-weight:600}
</style>
</head>
<body>
<div id="start" class="start-screen"></div>
<div id="app" hidden>
  <div class="layout">
    <div id="bench" aria-label="실험대"></div>
    <div id="notebook"></div>
  </div>
  <div id="toast-region"></div>
  <div id="zoom" hidden></div>
  <div id="report"></div>
</div>
<!-- 개인정보처리방침 링크는 **정적 HTML 에** 둔다.
     시작 화면은 자바스크립트가 그리므로, 응답 HTML 만 읽는 쪽(검사 도구·크롤러)에는
     아무것도 안 보인다. 사람에게도 늘 보여야 하는 링크라 화면 구석에 띄워 둔다. -->
<footer class="site-foot">
  <a href="/privacy">개인정보처리방침</a>
</footer>
<script type="module" src="/experiments/micrometer/src/main.js"></script>
</body>
</html>
