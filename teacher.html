<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선생님 화면 — 가상 생명과학 실험실</title>
<meta name="description" content="수업을 열고 학생이 낸 탐구 보고서를 받는 화면입니다.">
<!-- 학생용 화면이 아니다. 검색에 걸릴 이유가 없다. -->
<meta name="robots" content="noindex">
<!-- 보고서 "종이" 모양 — index.html 의 인쇄본과 같은 파일을 쓴다. -->
<link rel="stylesheet" href="/report-sheet.css">
<style>
  :root{
    --ground:#F4F6F1; --surface:#FFFFFF; --sunk:#EDF0E9; --ink:#171A22; --ink-mute:#5B6172;
    --rule:#D7DCCF; --indigo:#26348C; --good:#2F6B4F; --warn:#9C5A12; --danger:#A82920;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#12141A; --surface:#1A1D25; --sunk:#22262F; --ink:#E9ECE4; --ink-mute:#949BAA;
      --rule:#2E3441; --indigo:#94A4F2; --good:#7EC6A2; --warn:#E3A868; --danger:#E06A60;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);line-height:1.7;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:760px;margin:0 auto;padding:34px 20px 80px}
  h1{font-size:21px;margin:0 0 6px}
  .lead{color:var(--ink-mute);font-size:13.5px;margin:0 0 24px;line-height:1.65}
  h2{font-size:16px;margin:0 0 14px}

  .tc-card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
    padding:20px 22px;margin-bottom:18px}
  .tc-field{display:block;margin:0 0 12px}
  .tc-field span{display:block;font-size:12.5px;color:var(--ink-mute);margin-bottom:4px}
  .tc-field input,.tc-field select{width:100%;padding:9px 11px;font-size:14px;
    border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}
  .tc-hint{font-size:12.5px;color:var(--ink-mute);margin:4px 0 0;line-height:1.6}
  button{font:inherit;border:1px solid var(--rule);background:var(--sunk);color:var(--ink);
    border-radius:6px;padding:8px 13px;font-size:13.5px;cursor:pointer}
  button:hover{border-color:var(--ink-mute)}
  .tc-primary{background:var(--indigo);color:#fff;border-color:var(--indigo);font-weight:600;
    padding:11px 18px;font-size:14.5px;margin-top:14px}
  .tc-danger{background:var(--danger);color:#fff;border-color:var(--danger);margin-top:12px}
  .tc-msg{font-size:13px;margin:12px 0 0;min-height:1.2em}
  .tc-msg[data-kind="warn"]{color:var(--danger);font-weight:600}
  .tc-msg[data-kind="done"]{color:var(--good);font-weight:600}

  /* 이 셋은 화면에서 가장 커야 한다 — 교실 뒤에서도 읽혀야 하기 때문이다. */
  .tc-code-label{font-size:12.5px;color:var(--ink-mute);margin:0}
  .tc-code{font-family:ui-monospace,monospace;font-size:44px;letter-spacing:.16em;
    margin:2px 0 18px;font-weight:700}
  .tc-code-inline{font-family:ui-monospace,monospace;letter-spacing:.1em}

  .tc-copy{margin:0 0 14px}
  .tc-copy-label{display:block;font-size:12.5px;color:var(--ink-mute);margin-bottom:4px}
  .tc-copy-row{display:flex;gap:6px}
  .tc-copy-row input{flex:1;min-width:0;padding:8px 10px;font-size:12.5px;
    font-family:ui-monospace,monospace;border:1px solid var(--rule);border-radius:6px;
    background:var(--sunk);color:var(--ink)}
  .tc-copy-btn{flex:none}

  .tc-qr{margin:6px 0 0}
  .tc-qr-box{display:inline-block;padding:10px;background:#fff;border:1px solid var(--rule);
    border-radius:8px;line-height:0}
  .tc-qr-box--small{margin:0 0 16px}
  .tc-qr-box svg{display:block}

  .tc-rule{border:0;border-top:1px solid var(--rule);margin:22px 0}
  .tc-warn{font-size:12.5px;color:var(--danger);margin:6px 0 0;line-height:1.6}
  .tc-duty{font-size:12.5px;color:var(--ink-mute);line-height:1.65;
    background:var(--sunk);border-radius:8px;padding:11px 13px;margin:14px 0 0}

  .tc-board-head{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;
    flex-wrap:wrap;margin-bottom:14px}
  .tc-board-head h2{margin:0}
  .tc-count{color:var(--ink-mute);font-weight:400;font-size:13.5px}
  .tc-board-tools{display:flex;gap:6px;flex-wrap:wrap}
  .tc-empty{font-size:13.5px;color:var(--ink-mute);background:var(--sunk);border-radius:8px;
    padding:20px;text-align:center;margin:16px 0}

  .tc-list{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:8px}
  .tc-item{border:1px solid var(--rule);border-radius:8px;overflow:hidden}
  .tc-item-head{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:10px 12px;
    background:var(--sunk)}
  .tc-no{font-family:ui-monospace,monospace;font-size:13.5px}
  .tc-name{font-size:14px;font-weight:600}
  .tc-tag,.tc-when{font-size:12px;color:var(--ink-mute)}
  .tc-when{margin-left:auto}
  .tc-remove{color:var(--danger)}
  /* 펼친 보고서는 **종이**다. 다크 모드를 따라가면 종이 색(#555, #999)이 배경에 묻는다. */
  .tc-item-body{padding:16px;background:#fff;color:#111;overflow-x:auto}

  /* 용도 고르기 (T37) — 학생 화면 1쪽의 두 카드와 같은 순서·같은 이름이다. */
  .tc-purposes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .tc-purpose{display:block;border:1px solid var(--rule);border-radius:8px;padding:10px 12px;
    cursor:pointer;background:var(--surface)}
  .tc-purpose:hover{border-color:var(--ink-mute)}
  .tc-purpose.is-on{border-color:var(--indigo);box-shadow:inset 0 0 0 1px var(--indigo)}
  .tc-purpose input{width:auto;padding:0;margin:0 6px 0 0;vertical-align:-1px}
  .tc-purpose-name{font-size:14px;font-weight:600}
  .tc-purpose-desc{display:block;font-size:12.5px;color:var(--ink-mute);line-height:1.55;margin-top:3px}
  .tc-locked{background:var(--sunk);border-radius:8px;padding:10px 12px}
  .tc-form{display:inline-block;margin-top:8px;padding:9px 14px;border:1px solid var(--indigo);
    border-radius:6px;color:var(--indigo);text-decoration:none;font-size:13.5px;font-weight:600}
  .tc-form:hover{background:var(--indigo);color:#fff}
  @media (max-width:520px){ .tc-purposes{grid-template-columns:1fr} }

  .tc-choices{display:flex;flex-wrap:wrap;gap:6px 16px}
  .tc-choices label{display:inline-flex;gap:6px;align-items:center;font-size:14px;white-space:nowrap}
  .tc-field .tc-choice{display:inline;font-size:14px;color:var(--ink);margin:0}
  .tc-print-qr{text-align:center;padding-top:40px}
  .tc-print-qr h1{font-size:26px;margin:0 0 6px}
  .tc-print-qr p{font-size:15px;color:#333}
  .tc-print-qr svg{margin:18px auto;display:block}
  .tc-print-url{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all}

  .tc-print-area{display:none}

  /* 인쇄 — 화면 조작은 빼고 보고서만 낸다. 학생이 낸 것과 같은 종이가 나와야 한다. */
  @media print{
    body{background:#fff}
    main{display:none}
    .tc-print-area{display:block}
    .tc-print-one{break-after:page}
    .tc-print-one:last-child{break-after:auto}
  }
</style>
</head>
<body>
<main>
  <h1 id="tc-title-h"></h1>
  <p class="lead" id="tc-lead"></p>
  <div id="tc-app"></div>
  <p style="margin-top:28px;font-size:13.5px">
    <a href="/" style="color:var(--indigo)">← 실험 고르기</a> ·
    <a href="/privacy" style="color:var(--indigo)">개인정보처리방침</a>
  </p>
</main>
<script type="module" src="/src/teacher.js"></script>
</body>
</html>
